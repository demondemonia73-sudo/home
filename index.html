<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>TallerTotal Manager - Sistema Profesional</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔧</text></svg>">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>🔧 TallerTotal Manager</h1>
            <div class="user-info">
                <span id="userNameDisplay"></span>
                <button id="logoutBtn" class="btn btn-danger" style="display: none;">Cerrar Sesión</button>
            </div>
        </header>

        <nav class="tabs" id="tabsContainer" style="display: none;">
            <button class="tab-btn active" data-tab="dashboard">📊 Dashboard</button>
            <button class="tab-btn" data-tab="pedidos">📦 Pedidos</button>
            <button class="tab-btn" data-tab="productos">🛒 Productos</button>
            <button class="tab-btn" data-tab="clientes">👥 Clientes</button>
            <button class="tab-btn" data-tab="trabajadores">👨‍🔧 Trabajadores</button>
            <button class="tab-btn" data-tab="reportes">📄 Reportes</button>
        </nav>

        <!-- Panel Cliente (visible cuando NO hay sesión) -->
        <section id="clientePanel">
            <div class="card">
                <h2>🔍 Consultar mi pedido</h2>
                <div class="form-group">
                    <label for="consultaCodigo">Código de pedido</label>
                    <input type="text" id="consultaCodigo" placeholder="Ejemplo: PED-0001" class="form-control">
                </div>
                <div class="form-group">
                    <label for="consultaTelefono">Tu número de teléfono</label>
                    <input type="tel" id="consultaTelefono" placeholder="0987654321" class="form-control">
                </div>
                <div class="button-group">
                    <button id="consultarBtn" class="btn btn-primary">Consultar</button>
                    <button id="nuevoPedidoBtn" class="btn btn-success">➕ Hacer nuevo pedido</button>
                </div>
            </div>
            <div id="resultadoConsulta"></div>
            
            <!-- Botón para acceder al login desde el panel cliente -->
            <div style="text-align: center; margin-top: 1rem;">
                <button id="mostrarLoginBtn" class="btn btn-primary" style="background: #6c757d;">
                    🔐 Soy trabajador / Admin - Iniciar sesión
                </button>
            </div>
        </section>

        <main id="tabsContent" style="display: none;"></main>
    </div>

    <!-- Modal de Login -->
    <div id="loginModal" class="modal">
        <div class="modal-content">
            <h2>🔐 Iniciar Sesión</h2>
            <div id="loginError" class="alert alert-danger" style="display: none;"></div>
            <div class="form-group">
                <label for="loginEmail">Correo electrónico</label>
                <input type="email" id="loginEmail" placeholder="admin@taller.com" class="form-control">
            </div>
            <div class="form-group">
                <label for="loginPassword">Contraseña</label>
                <input type="password" id="loginPassword" placeholder="••••••••" class="form-control">
            </div>
            <button id="loginBtn" class="btn btn-primary btn-block">Ingresar al sistema</button>
            <hr>
            <p class="text-muted text-center">¿Eres cliente? Usa el código de tu pedido en el panel superior</p>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="auth.js"></script>
    <script src="dashboard.js"></script>
    <script src="pedidos.js"></script>
    <script src="main.js"></script>
</body>
</html>
