<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>TallerTotal Manager - Sistema de Gestión</title>
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- jsPDF y AutoTable para PDFs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <!-- QR Code -->
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Header y navegación */
        .header {
            background: linear-gradient(135deg, #1a73e8, #0d47a1);
            color: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header h1 {
            font-size: 1.5rem;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn-logout {
            background: #dc3545;
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            color: white;
            cursor: pointer;
        }

        .btn-logout:hover {
            background: #c82333;
        }

        /* Pestañas */
        .tabs {
            display: flex;
            gap: 5px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: #e0e0e0;
            border: none;
            padding: 12px 24px;
            border-radius: 8px 8px 0 0;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .tab-btn.active {
            background: #1a73e8;
            color: white;
        }

        .tab-content {
            display: none;
            background: white;
            border-radius: 0 12px 12px 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .tab-content.active {
            display: block;
        }

        /* Formularios y tarjetas */
        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }

        button {
            background: #1a73e8;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }

        button:hover {
            background: #1557b0;
        }

        button.danger {
            background: #dc3545;
        }

        button.success {
            background: #28a745;
        }

        button.warning {
            background: #ffc107;
            color: #333;
        }

        /* Tablas */
        .table-container {
            overflow-x: auto;
            margin-top: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }

        th {
            background: #1a73e8;
            color: white;
        }

        tr:nth-child(even) {
            background: #f9f9f9;
        }

        /* Tarjetas de productos */
        .productos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .producto-card {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            background: white;
        }

        .producto-card h4 {
            margin-bottom: 10px;
            color: #1a73e8;
        }

        /* Login modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
        }

        .qr-container {
            text-align: center;
            margin: 15px 0;
        }

        /* Badges de estado */
        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }

        .badge-pendiente { background: #ffc107; color: #333; }
        .badge-proceso { background: #17a2b8; color: white; }
        .badge-terminado { background: #28a745; color: white; }
        .badge-enviado { background: #6c757d; color: white; }
        .badge-entregado { background: #007bff; color: white; }

        /* Mensajes */
        .alert {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                text-align: center;
            }
            .tab-btn {
                flex: 1;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>🔧 TallerTotal Manager</h1>
            <div class="user-info" id="userInfo">
                <span id="userNameDisplay"></span>
                <button class="btn-logout" onclick="logout()" style="display: none;">Cerrar Sesión</button>
            </div>
        </div>

        <!-- Pestañas (solo visibles cuando hay sesión) -->
        <div class="tabs" id="tabsContainer" style="display: none;">
            <button class="tab-btn active" data-tab="dashboard">📊 Dashboard</button>
            <button class="tab-btn" data-tab="pedidos">📦 Pedidos</button>
            <button class="tab-btn" data-tab="productos">🛒 Productos</button>
            <button class="tab-btn" data-tab="clientes">👥 Clientes</button>
            <button class="tab-btn" data-tab="trabajadores">👨‍🔧 Trabajadores</button>
            <button class="tab-btn" data-tab="reportes">📄 Reportes</button>
        </div>

        <!-- Panel Cliente (sin login, consulta de pedidos) -->
        <div id="clientePanel">
            <div class="card" style="background: white; padding: 20px; border-radius: 12px;">
                <h3>🔍 Consultar mi pedido</h3>
                <div class="form-group">
                    <label>Código de pedido (ej: PED-0001)</label>
                    <input type="text" id="consultaCodigo" placeholder="PED-0001">
                </div>
                <div class="form-group">
                    <label>Tu número de teléfono</label>
                    <input type="text" id="consultaTelefono" placeholder="0987654321">
                </div>
                <button onclick="consultarPedido()">Consultar</button>
                <button onclick="mostrarNuevoPedidoForm()" style="background: #28a745;">➕ Hacer nuevo pedido</button>
            </div>

            <div id="resultadoConsulta" style="margin-top: 20px;"></div>
            <div id="nuevoPedidoForm" style="display: none; margin-top: 20px; background: white; padding: 20px; border-radius: 12px;"></div>
        </div>

        <!-- Contenido de pestañas (Dashboard, etc.) -->
        <div id="tabsContent" style="display: none;"></div>
    </div>

    <!-- Modal de Login -->
    <div id="loginModal" class="modal active">
        <div class="modal-content">
            <h2>🔐 Iniciar Sesión</h2>
            <div id="loginError" class="alert alert-error" style="display: none;"></div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="loginEmail" placeholder="admin@taller.com">
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" id="loginPassword" placeholder="admin123">
            </div>
            <button onclick="login()" style="width: 100%;">Ingresar</button>
            <hr style="margin: 15px 0;">
            <p style="text-align: center; font-size: 12px; color: #666;">¿Eres cliente? Usa el código de tu pedido arriba</p>
        </div>
    </div>

    <script>
        // =====================================================
        // CONFIGURACIÓN DE SUPABASE
        // =====================================================
        // REEMPLAZA ESTOS VALORES CON LOS DE TU PROYECTO
        const SUPABASE_URL = 'https://iyanyiihgjnnlcjapnge.supabase.co';  // Confirma esta URL
        const SUPABASE_ANON_KEY = 'sb_publishable_gxx8Bo4xtnPcCHWTooE3fA_yE9j1cIz';
        
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        // Variables globales
        let currentUser = null;
        let currentUserRole = null;
        let currentUserName = null;

        // =====================================================
        // FUNCIONES DE AUTENTICACIÓN
        // =====================================================
        async function login() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const errorDiv = document.getElementById('loginError');
            
            errorDiv.style.display = 'none';
            
            if (!email || !password) {
                errorDiv.textContent = 'Ingresa email y contraseña';
                errorDiv.style.display = 'block';
                return;
            }
            
            // Buscar usuario en la tabla usuarios
            const { data, error } = await supabase
                .from('usuarios')
                .select('*')
                .eq('email', email)
                .eq('activo', true)
                .single();
            
            if (error || !data) {
                errorDiv.textContent = 'Usuario no encontrado';
                errorDiv.style.display = 'block';
                return;
            }
            
            // Comparar contraseña (texto plano por ahora - luego mejoramos con hash)
            if (data.password_hash !== password) {
                errorDiv.textContent = 'Contraseña incorrecta';
                errorDiv.style.display = 'block';
                return;
            }
            
            // Login exitoso
            currentUser = data;
            currentUserRole = data.rol;
            currentUserName = data.nombre;
            
            document.getElementById('loginModal').classList.remove('active');
            document.getElementById('userNameDisplay').textContent = `👋 ${currentUserName} (${currentUserRole === 'admin' ? 'Administrador' : 'Trabajador'})`;
            document.querySelector('.btn-logout').style.display = 'block';
            document.getElementById('tabsContainer').style.display = 'flex';
            document.getElementById('clientePanel').style.display = 'none';
            document.getElementById('tabsContent').style.display = 'block';
            
            // Cargar dashboard según rol
            cargarDashboard();
        }
        
        function logout() {
            currentUser = null;
            currentUserRole = null;
            currentUserName = null;
            
            document.getElementById('loginModal').classList.add('active');
            document.getElementById('userNameDisplay').textContent = '';
            document.querySelector('.btn-logout').style.display = 'none';
            document.getElementById('tabsContainer').style.display = 'none';
            document.getElementById('clientePanel').style.display = 'block';
            document.getElementById('tabsContent').style.display = 'none';
            
            // Limpiar formularios
            document.getElementById('consultaCodigo').value = '';
            document.getElementById('consultaTelefono').value = '';
            document.getElementById('resultadoConsulta').innerHTML = '';
        }
        
        // =====================================================
        // DASHBOARD
        // =====================================================
        async function cargarDashboard() {
            const tabsContent = document.getElementById('tabsContent');
            
            // Estadísticas
            const { data: pedidosData } = await supabase.from('pedidos').select('*');
            const { data: clientesData } = await supabase.from('clientes').select('*');
            const { data: productosData } = await supabase.from('productos').select('*');
            
            const pendientes = pedidosData ? pedidosData.filter(p => p.estado === 'pendiente').length : 0;
            const enProceso = pedidosData ? pedidosData.filter(p => p.estado === 'en_proceso').length : 0;
            const terminados = pedidosData ? pedidosData.filter(p => p.estado === 'terminado').length : 0;
            
            let dashboardHtml = `
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px;">
                    <div style="background: #1a73e8; color: white; padding: 20px; border-radius: 12px; text-align: center;">
                        <h3>📦 Pedidos Pendientes</h3>
                        <p style="font-size: 2rem;">${pendientes}</p>
                    </div>
                    <div style="background: #ffc107; padding: 20px; border-radius: 12px; text-align: center;">
                        <h3>⚙️ En Proceso</h3>
                        <p style="font-size: 2rem;">${enProceso}</p>
                    </div>
                    <div style="background: #28a745; color: white; padding: 20px; border-radius: 12px; text-align: center;">
                        <h3>✅ Terminados</h3>
                        <p style="font-size: 2rem;">${terminados}</p>
                    </div>
                    <div style="background: #17a2b8; color: white; padding: 20px; border-radius: 12px; text-align: center;">
                        <h3>👥 Clientes</h3>
                        <p style="font-size: 2rem;">${clientesData ? clientesData.length : 0}</p>
                    </div>
                </div>
                
                <h3>📋 Últimos Pedidos</h3>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr><th>Código</th><th>Cliente</th><th>Estado</th><th>Total</th><th>Fecha</th><th>Acciones</th></tr>
                        </thead>
                        <tbody id="ultimosPedidosTabla">
                        </tbody>
                    </table>
                </div>
            `;
            
            tabsContent.innerHTML = dashboardHtml;
            
            // Cargar últimos pedidos
            const { data: pedidos } = await supabase
                .from('pedidos')
                .select('*, clientes(nombre)')
                .order('created_at', { ascending: false })
                .limit(10);
            
            const tbody = document.getElementById('ultimosPedidosTabla');
            if (pedidos && pedidos.length > 0) {
                tbody.innerHTML = pedidos.map(p => `
                    <tr>
                        <td>${p.codigo}</td>
                        <td>${p.clientes ? p.clientes.nombre : 'N/A'}</td>
                        <td><span class="badge badge-${p.estado === 'pendiente' ? 'pendiente' : p.estado === 'en_proceso' ? 'proceso' : p.estado}">${p.estado}</span></td>
                        <td>$${p.total}</td>
                        <td>${new Date(p.fecha_creacion).toLocaleDateString()}</td>
                        <td><button onclick="verDetallePedido(${p.id})">Ver</button></td>
                    </tr>
                `).join('');
            } else {
                tbody.innerHTML = '<tr><td colspan="6">No hay pedidos registrados</td></tr>';
            }
        }
        
        // =====================================================
        // CONSULTA DE PEDIDO PARA CLIENTES
        // =====================================================
        async function consultarPedido() {
            const codigo = document.getElementById('consultaCodigo').value.trim();
            const telefono = document.getElementById('consultaTelefono').value.trim();
            const resultadoDiv = document.getElementById('resultadoConsulta');
            
            if (!codigo || !telefono) {
                resultadoDiv.innerHTML = '<div class="alert alert-error">Ingresa código y teléfono</div>';
                return;
            }
            
            // Buscar pedido
            const { data: pedido, error } = await supabase
                .from('pedidos')
                .select('*, clientes(*)')
                .eq('codigo', codigo)
                .single();
            
            if (error || !pedido) {
                resultadoDiv.innerHTML = '<div class="alert alert-error">Pedido no encontrado</div>';
                return;
            }
            
            // Verificar teléfono
            if (pedido.clientes.telefono !== telefono) {
                resultadoDiv.innerHTML = '<div class="alert alert-error">Teléfono incorrecto para este pedido</div>';
                return;
            }
            
            // Obtener detalles del pedido
            const { data: detalles } = await supabase
                .from('detalle_pedido')
                .select('*')
                .eq('pedido_id', pedido.id);
            
            // Obtener asignación (fecha estimada)
            const { data: asignacion } = await supabase
                .from('asignaciones')
                .select('*, usuarios(nombre)')
                .eq('pedido_id', pedido.id)
                .single();
            
            let estadoTexto = '';
            switch(pedido.estado) {
                case 'pendiente': estadoTexto = '<span class="badge badge-pendiente">⏳ Pendiente - Esperando asignación</span>'; break;
                case 'en_proceso': estadoTexto = '<span class="badge badge-proceso">⚙️ En proceso</span>'; break;
                case 'terminado': estadoTexto = '<span class="badge badge-terminado">✅ Terminado - Listo para retirar</span>'; break;
                case 'enviado': estadoTexto = '<span class="badge badge-enviado">🚚 Enviado</span>'; break;
                case 'entregado': estadoTexto = '<span class="badge badge-entregado">📦 Entregado</span>'; break;
                default: estadoTexto = pedido.estado;
            }
            
            let fechaEstimadaHtml = '';
            if (asignacion && asignacion.fecha_estimada_entrega) {
                fechaEstimadaHtml = `<p><strong>📅 Fecha estimada de entrega:</strong> ${new Date(asignacion.fecha_estimada_entrega).toLocaleDateString()}</p>`;
                if (asignacion.usuarios) {
                    fechaEstimadaHtml += `<p><strong>👨‍🔧 A cargo:</strong> ${asignacion.usuarios.nombre}</p>`;
                }
            }
            
            let adelantoHtml = '';
            if (pedido.adelanto_monto > 0) {
                adelantoHtml = `
                    <p><strong>💰 Adelanto requerido:</strong> $${pedido.adelanto_monto}</p>
                    <p><strong>✅ Adelanto confirmado:</strong> ${pedido.adelanto_confirmado ? 'Sí' : 'Pendiente de confirmación'}</p>
                `;
                if (!pedido.adelanto_confirmado && pedido.qr_adelanto_url) {
                    adelantoHtml += `<div class="qr-container" id="qrAdelanto"></div>`;
                    setTimeout(() => {
                        new QRCode(document.getElementById("qrAdelanto"), {
                            text: pedido.qr_adelanto_url,
                            width: 128,
                            height: 128
                        });
                    }, 100);
                }
            }
            
            let detallesHtml = '<h4>📋 Detalle del pedido:</h4><ul>';
            if (detalles && detalles.length > 0) {
                detalles.forEach(d => {
                    detallesHtml += `<li>${d.cantidad} x ${d.descripcion} - $${d.subtotal}</li>`;
                });
            }
            detallesHtml += '</ul>';
            
            resultadoDiv.innerHTML = `
                <div style="background: white; padding: 20px; border-radius: 12px; margin-top: 15px;">
                    <h3>📄 Pedido ${pedido.codigo}</h3>
                    <p><strong>Cliente:</strong> ${pedido.clientes.nombre}</p>
                    <p><strong>Estado:</strong> ${estadoTexto}</p>
                    ${fechaEstimadaHtml}
                    ${adelantoHtml}
                    ${detallesHtml}
                    <p><strong>💰 Total:</strong> $${pedido.total}</p>
                    ${pedido.estado === 'terminado' ? '<button class="success" onclick="alert(\'Contacta al taller para coordinar retiro\')">📞 Solicitar retiro</button>' : ''}
                </div>
            `;
        }
        
        // =====================================================
        // INICIALIZAR
        // =====================================================
        function mostrarNuevoPedidoForm() {
            alert('Formulario de nuevo pedido en desarrollo. Próximamente disponible.');
        }
        
        function verDetallePedido(id) {
            alert('Detalle de pedido - Función en desarrollo');
        }
        
        // Configurar tabs
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const tab = btn.dataset.tab;
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                if (tab === 'dashboard') cargarDashboard();
                else cargarTabGenerico(tab);
            });
        });
        
        async function cargarTabGenerico(tab) {
            const tabsContent = document.getElementById('tabsContent');
            tabsContent.innerHTML = `<div style="padding: 40px; text-align: center;"><h3>📌 Módulo ${tab} en construcción</h3><p>Próximamente disponible</p></div>`;
        }
        
        console.log('✅ Sistema listo');
    </script>
</body>
</html>
